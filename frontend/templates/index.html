<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GovPlan_AI - 정부지원사업 자동화 플랫폼</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- 네비게이션 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-graph-up-arrow"></i> GovPlan_AI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">대시보드</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/projects">공고 검색</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/matching">매칭 결과</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/proposals">사업계획서</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/docs" target="_blank">API 문서</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <div class="container-fluid mt-4">
        <div class="row">
            <!-- 통계 카드 -->
            <div class="col-md-3 mb-4">
                <div class="card stats-card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-subtitle mb-2">전체 공고</h6>
                                <h2 class="card-title mb-0" id="total-projects">-</h2>
                            </div>
                            <i class="bi bi-file-text display-4"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-4">
                <div class="card stats-card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-subtitle mb-2">진행중</h6>
                                <h2 class="card-title mb-0" id="active-projects">-</h2>
                            </div>
                            <i class="bi bi-check-circle display-4"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-4">
                <div class="card stats-card bg-warning text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-subtitle mb-2">나의 매칭</h6>
                                <h2 class="card-title mb-0" id="my-matches">-</h2>
                            </div>
                            <i class="bi bi-star display-4"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-4">
                <div class="card stats-card bg-info text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-subtitle mb-2">사업계획서</h6>
                                <h2 class="card-title mb-0" id="my-proposals">-</h2>
                            </div>
                            <i class="bi bi-file-earmark-text display-4"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 최근 공고 -->
            <div class="col-md-8 mb-4">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">
                            <i class="bi bi-clock-history"></i> 최근 등록 공고
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="recent-projects" class="list-group">
                            <div class="text-center p-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 퀵 액션 -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">
                            <i class="bi bi-lightning"></i> 빠른 작업
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary btn-lg" onclick="searchProjects()">
                                <i class="bi bi-search"></i> 공고 검색
                            </button>
                            <button class="btn btn-success btn-lg" onclick="calculateMatching()">
                                <i class="bi bi-bullseye"></i> 매칭 계산
                            </button>
                            <button class="btn btn-info btn-lg" onclick="generateProposal()">
                                <i class="bi bi-file-earmark-plus"></i> 사업계획서 생성
                            </button>
                            <button class="btn btn-warning btn-lg" onclick="runCrawler()">
                                <i class="bi bi-arrow-clockwise"></i> 크롤링 실행
                            </button>
                        </div>

                        <hr class="my-4">

                        <h6 class="mb-3">시스템 상태</h6>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span>API 서버</span>
                            <span class="badge bg-success" id="api-status">정상</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span>데이터베이스</span>
                            <span class="badge bg-success" id="db-status">정상</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <span>Celery 워커</span>
                            <span class="badge bg-success" id="celery-status">정상</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 카테고리별 공고 -->
        <div class="row">
            <div class="col-12 mb-4">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">
                            <i class="bi bi-grid"></i> 카테고리별 공고 분포
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="category-chart" class="row" style="min-height: 200px;">
                            <div class="col text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light mt-5 py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h6>GovPlan_AI</h6>
                    <p class="text-muted small">정부지원사업 자동화 플랫폼</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="text-muted small">
                        <a href="/docs" target="_blank" class="text-decoration-none">API 문서</a> |
                        <a href="https://github.com/ssdavo34/GovPlan_Ai" target="_blank" class="text-decoration-none">GitHub</a>
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
