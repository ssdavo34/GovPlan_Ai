<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공고 검색 - GovPlan_AI</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- 네비게이션 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-graph-up-arrow"></i> GovPlan_AI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">대시보드</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/projects">공고 검색</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/matching">매칭 결과</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/proposals">사업계획서</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/docs" target="_blank">API 문서</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12 mb-4">
                <h2><i class="bi bi-search"></i> 정부지원사업 공고 검색</h2>
            </div>
        </div>

        <!-- 검색 필터 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-funnel"></i> 검색 필터</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="keyword" class="form-label">키워드</label>
                                <input type="text" class="form-control" id="keyword" placeholder="사업명, 기관명 등">
                            </div>
                            <div class="col-md-3">
                                <label for="supportType" class="form-label">지원 유형</label>
                                <select class="form-select" id="supportType">
                                    <option value="">전체</option>
                                    <option value="보조금">보조금</option>
                                    <option value="융자">융자</option>
                                    <option value="컨설팅">컨설팅</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="status" class="form-label">상태</label>
                                <select class="form-select" id="status">
                                    <option value="">전체</option>
                                    <option value="active" selected>진행중</option>
                                    <option value="expired">마감</option>
                                </select>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-primary w-100" onclick="searchProjects()">
                                    <i class="bi bi-search"></i> 검색
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 검색 결과 -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-list-ul"></i> 검색 결과 <span id="result-count" class="badge bg-primary">0</span></h5>
                        <div>
                            <select class="form-select form-select-sm" id="sortBy" onchange="searchProjects()">
                                <option value="recent">최신순</option>
                                <option value="deadline">마감임박순</option>
                                <option value="amount">지원금액순</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="search-results" class="list-group">
                            <div class="text-center p-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>

                        <!-- 페이지네이션 -->
                        <nav aria-label="Page navigation" class="mt-3">
                            <ul class="pagination justify-content-center" id="pagination"></ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light mt-5 py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h6>GovPlan_AI</h6>
                    <p class="text-muted small">정부지원사업 자동화 플랫폼</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="text-muted small">
                        <a href="/docs" target="_blank" class="text-decoration-none">API 문서</a> |
                        <a href="https://github.com/ssdavo34/GovPlan_Ai" target="_blank" class="text-decoration-none">GitHub</a>
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8000/api/v1';
        let currentPage = 1;
        const itemsPerPage = 20;

        // 페이지 로드 시 초기 검색
        document.addEventListener('DOMContentLoaded', function() {
            searchProjects();
        });

        // 공고 검색
        async function searchProjects(page = 1) {
            const keyword = document.getElementById('keyword').value;
            const supportType = document.getElementById('supportType').value;
            const status = document.getElementById('status').value;
            const sortBy = document.getElementById('sortBy').value;
            const container = document.getElementById('search-results');

            try {
                // API 호출 파라미터 구성
                let url = `${API_BASE_URL}/projects?limit=${itemsPerPage}&skip=${(page - 1) * itemsPerPage}`;

                if (status) url += `&status=${status}`;
                if (supportType) url += `&support_type=${supportType}`;
                if (keyword) url += `&search=${encodeURIComponent(keyword)}`;

                const response = await fetch(url);
                const data = await response.json();

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '<p class="text-muted text-center">검색 결과가 없습니다.</p>';
                    document.getElementById('result-count').textContent = '0';
                    return;
                }

                // 결과 수 업데이트
                document.getElementById('result-count').textContent = data.total || data.items.length;

                // 결과 렌더링
                container.innerHTML = '';
                data.items.forEach((project, index) => {
                    const projectEl = createProjectCard(project, (page - 1) * itemsPerPage + index + 1);
                    container.appendChild(projectEl);
                });

                // 페이지네이션 업데이트
                updatePagination(data.total || data.items.length, page);

            } catch (error) {
                console.error('검색 실패:', error);
                container.innerHTML = '<p class="text-danger text-center">검색에 실패했습니다.</p>';
            }
        }

        // 프로젝트 카드 생성
        function createProjectCard(project, index) {
            const div = document.createElement('div');
            div.className = 'list-group-item project-item';

            const endDate = project.application_end_date ?
                new Date(project.application_end_date).toLocaleDateString('ko-KR') : 'N/A';

            // D-day 계산
            let dday = '';
            if (project.application_end_date) {
                const today = new Date();
                const deadline = new Date(project.application_end_date);
                const diffTime = deadline - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays > 0) {
                    dday = `<span class="badge bg-warning text-dark">D-${diffDays}</span>`;
                } else if (diffDays === 0) {
                    dday = `<span class="badge bg-danger">오늘 마감</span>`;
                }
            }

            div.innerHTML = `
                <div class="d-flex w-100 justify-content-between align-items-start">
                    <div class="flex-grow-1">
                        <h6 class="mb-1">${index}. ${project.project_name || 'N/A'}</h6>
                        <p class="mb-1 text-muted small">
                            <i class="bi bi-building"></i> ${project.agency || 'N/A'} |
                            <i class="bi bi-calendar"></i> 마감: ${endDate} ${dday}
                        </p>
                        ${project.support_amount ? `<p class="mb-0 small"><i class="bi bi-cash"></i> ${project.support_amount}</p>` : ''}
                        ${project.description ? `<p class="mb-0 small text-muted mt-2">${project.description.substring(0, 150)}...</p>` : ''}
                    </div>
                    <div class="text-end ms-3">
                        <span class="badge bg-primary">${project.support_type || '일반'}</span>
                        ${project.project_url ? `<br><a href="${project.project_url}" target="_blank" class="btn btn-sm btn-outline-primary mt-2">상세보기</a>` : ''}
                    </div>
                </div>
            `;

            return div;
        }

        // 페이지네이션 업데이트
        function updatePagination(total, currentPage) {
            const totalPages = Math.ceil(total / itemsPerPage);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            if (totalPages <= 1) return;

            // 이전 버튼
            const prevLi = document.createElement('li');
            prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
            prevLi.innerHTML = `<a class="page-link" href="#" onclick="searchProjects(${currentPage - 1}); return false;">이전</a>`;
            pagination.appendChild(prevLi);

            // 페이지 번호
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            for (let i = startPage; i <= endPage; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === currentPage ? 'active' : ''}`;
                li.innerHTML = `<a class="page-link" href="#" onclick="searchProjects(${i}); return false;">${i}</a>`;
                pagination.appendChild(li);
            }

            // 다음 버튼
            const nextLi = document.createElement('li');
            nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
            nextLi.innerHTML = `<a class="page-link" href="#" onclick="searchProjects(${currentPage + 1}); return false;">다음</a>`;
            pagination.appendChild(nextLi);
        }
    </script>
</body>
</html>
