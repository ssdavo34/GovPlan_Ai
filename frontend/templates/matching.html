<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매칭 결과 - GovPlan_AI</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- 네비게이션 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-graph-up-arrow"></i> GovPlan_AI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">대시보드</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/projects">공고 검색</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/matching">매칭 결과</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/proposals">사업계획서</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/docs" target="_blank">API 문서</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12 mb-4">
                <h2><i class="bi bi-bullseye"></i> 매칭 결과</h2>
                <p class="text-muted">귀사에 적합한 정부지원사업을 AI가 추천합니다</p>
            </div>
        </div>

        <!-- 기업 선택 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <label for="companySelect" class="form-label"><strong>기업 선택</strong></label>
                        <div class="input-group">
                            <select class="form-select" id="companySelect" onchange="loadMatching()">
                                <option value="">기업을 선택하세요</option>
                            </select>
                            <button class="btn btn-primary" onclick="calculateMatching()">
                                <i class="bi bi-calculator"></i> 매칭 계산
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <label class="form-label"><strong>매칭 필터</strong></label>
                        <div class="row g-2">
                            <div class="col-6">
                                <label for="minScore" class="form-label small">최소 점수</label>
                                <input type="number" class="form-control" id="minScore" value="40" min="0" max="100" onchange="loadMatching()">
                            </div>
                            <div class="col-6">
                                <label for="maxResults" class="form-label small">최대 결과</label>
                                <input type="number" class="form-control" id="maxResults" value="20" min="1" max="100" onchange="loadMatching()">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 매칭 결과 -->
        <div class="row">
            <!-- 강력 추천 -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="bi bi-fire"></i> 강력 추천 (80점 이상)</h5>
                    </div>
                    <div class="card-body">
                        <div id="excellent-matches" class="list-group">
                            <p class="text-muted text-center">기업을 선택하고 매칭을 계산하세요</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 추천 -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="bi bi-check-circle"></i> 추천 (60-79점)</h5>
                    </div>
                    <div class="card-body">
                        <div id="good-matches" class="list-group">
                            <p class="text-muted text-center">기업을 선택하고 매칭을 계산하세요</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 검토 가능 -->
            <div class="col-12 mb-4">
                <div class="card">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0"><i class="bi bi-star"></i> 검토 가능 (40-59점)</h5>
                    </div>
                    <div class="card-body">
                        <div id="fair-matches" class="list-group">
                            <p class="text-muted text-center">기업을 선택하고 매칭을 계산하세요</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-light mt-5 py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h6>GovPlan_AI</h6>
                    <p class="text-muted small">정부지원사업 자동화 플랫폼</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="text-muted small">
                        <a href="/docs" target="_blank" class="text-decoration-none">API 문서</a> |
                        <a href="https://github.com/ssdavo34/GovPlan_Ai" target="_blank" class="text-decoration-none">GitHub</a>
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8000/api/v1';

        // 페이지 로드 시
        document.addEventListener('DOMContentLoaded', function() {
            loadCompanies();
        });

        // 기업 목록 로드
        async function loadCompanies() {
            try {
                const response = await fetch(`${API_BASE_URL}/companies?limit=100`);
                const data = await response.json();

                const select = document.getElementById('companySelect');
                select.innerHTML = '<option value="">기업을 선택하세요</option>';

                if (data.items && data.items.length > 0) {
                    data.items.forEach(company => {
                        const option = document.createElement('option');
                        option.value = company.id;
                        option.textContent = company.company_name;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('기업 목록 로드 실패:', error);
            }
        }

        // 매칭 계산
        async function calculateMatching() {
            const companyId = document.getElementById('companySelect').value;
            if (!companyId) {
                alert('기업을 먼저 선택하세요');
                return;
            }

            const minScore = document.getElementById('minScore').value;
            const maxResults = document.getElementById('maxResults').value;

            try {
                const response = await fetch(
                    `${API_BASE_URL}/matching/calculate/${companyId}?min_score=${minScore}&max_results=${maxResults}`,
                    { method: 'POST' }
                );
                const data = await response.json();

                alert(`매칭 계산 완료: ${data.total_matches}건 발견`);
                loadMatching();

            } catch (error) {
                console.error('매칭 계산 실패:', error);
                alert('매칭 계산에 실패했습니다');
            }
        }

        // 매칭 결과 로드
        async function loadMatching() {
            const companyId = document.getElementById('companySelect').value;
            if (!companyId) return;

            const minScore = document.getElementById('minScore').value;

            try {
                const response = await fetch(
                    `${API_BASE_URL}/matching/${companyId}?min_score=${minScore}`
                );
                const data = await response.json();

                if (!data.matches || data.matches.length === 0) {
                    showEmptyMatches();
                    return;
                }

                // 점수별 분류
                const excellent = data.matches.filter(m => m.match_score >= 80);
                const good = data.matches.filter(m => m.match_score >= 60 && m.match_score < 80);
                const fair = data.matches.filter(m => m.match_score >= 40 && m.match_score < 60);

                renderMatches('excellent-matches', excellent);
                renderMatches('good-matches', good);
                renderMatches('fair-matches', fair);

            } catch (error) {
                console.error('매칭 결과 로드 실패:', error);
                showEmptyMatches();
            }
        }

        // 매칭 결과 렌더링
        function renderMatches(containerId, matches) {
            const container = document.getElementById(containerId);

            if (!matches || matches.length === 0) {
                container.innerHTML = '<p class="text-muted text-center">해당하는 매칭이 없습니다</p>';
                return;
            }

            container.innerHTML = '';

            matches.forEach((match, index) => {
                const div = document.createElement('div');
                div.className = 'list-group-item';

                const scoreClass = match.match_score >= 80 ? 'danger' :
                                  match.match_score >= 60 ? 'success' : 'warning';

                div.innerHTML = `
                    <div class="d-flex w-100 justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <h6 class="mb-1">${index + 1}. ${match.project_name || 'N/A'}</h6>
                            <p class="mb-1 text-muted small">
                                <i class="bi bi-building"></i> ${match.agency || 'N/A'}
                            </p>
                            ${match.match_reason ? `<p class="mb-0 small text-muted">${match.match_reason}</p>` : ''}
                        </div>
                        <div class="text-end ms-3">
                            <span class="badge bg-${scoreClass} badge-match-score">${match.match_score.toFixed(1)}점</span>
                            ${match.project_url ? `<br><a href="${match.project_url}" target="_blank" class="btn btn-sm btn-outline-primary mt-2">상세보기</a>` : ''}
                        </div>
                    </div>
                `;

                container.appendChild(div);
            });
        }

        // 빈 매칭 표시
        function showEmptyMatches() {
            document.getElementById('excellent-matches').innerHTML = '<p class="text-muted text-center">해당하는 매칭이 없습니다</p>';
            document.getElementById('good-matches').innerHTML = '<p class="text-muted text-center">해당하는 매칭이 없습니다</p>';
            document.getElementById('fair-matches').innerHTML = '<p class="text-muted text-center">해당하는 매칭이 없습니다</p>';
        }
    </script>
</body>
</html>
