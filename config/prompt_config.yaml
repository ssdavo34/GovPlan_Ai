# AI 프롬프트 템플릿 설정

# 시스템 프롬프트
system_prompts:
  proposal_writer: |
    당신은 정부지원사업 사업계획서 작성 전문가입니다.
    20년 이상의 경력을 가진 컨설턴트로서, 수백 건의 사업계획서를 작성하고 심사했습니다.

    작성 원칙:
    1. 구체적인 수치와 데이터를 활용하여 신뢰성 확보
    2. 사업의 필요성과 타당성을 명확히 제시
    3. 실현 가능한 계획 수립 (과도한 목표 지양)
    4. 정부 정책 방향과의 연계성 강조
    5. 기업의 강점과 역량 부각
    6. 명확하고 간결한 문장 사용

    항상 한국어로 작성하며, 전문적이면서도 이해하기 쉬운 표현을 사용합니다.

  summary_writer: |
    당신은 정부지원사업 공고를 분석하고 요약하는 전문가입니다.
    공고의 핵심 내용을 파악하여 기업이 빠르게 이해할 수 있도록 요약합니다.

  keyword_extractor: |
    당신은 텍스트에서 핵심 키워드를 추출하는 전문가입니다.
    사업공고와 기업정보에서 중요한 키워드를 정확히 추출합니다.

# 사업계획서 생성 프롬프트
proposal_templates:
  full_proposal: |
    다음 정보를 바탕으로 전문적인 사업계획서를 작성해주세요.

    ## 공고 정보
    - 사업명: {grant_title}
    - 지원 분야: {category}
    - 지원 금액: {budget_min:,}원 ~ {budget_max:,}원
    - 담당 기관: {agency}
    - 사업 개요: {description}

    ## 기업 정보
    - 기업명: {company_name}
    - 업종: {industry}
    - 기업 유형: {company_type}
    - 설립일: {founded_date}
    - 직원 수: {employee_count}명
    - 기술 분야: {tech_fields}
    - 기업 강점: {strengths}

    ## 요청사항
    다음 구조로 사업계획서를 작성해주세요. 각 섹션은 명확하게 구분하고,
    마크다운 형식으로 작성해주세요.

    ### 1. 사업 개요 (200-300자)
    - 사업의 목적과 방향을 간결하게 요약

    ### 2. 추진 배경 및 필요성 (500-700자)
    - 사업 추진의 배경
    - 현재 시장/산업의 문제점
    - 본 사업의 필요성

    ### 3. 사업 목표 및 추진 전략 (800-1000자)
    - 구체적인 목표 (정량적 지표 포함)
    - 목표 달성을 위한 전략
    - 차별화 포인트

    ### 4. 추진 체계 및 일정 (600-800자)
    - 추진 조직 및 인력
    - 단계별 추진 일정 (표 형식)
    - 각 단계별 주요 활동

    ### 5. 기대 효과 (400-600자)
    - 정량적 효과 (매출, 고용 등)
    - 정성적 효과 (기술 개발, 시장 확대 등)
    - 사회적 기여

    ### 6. 예산 계획
    - 항목별 예산 배분 (표 형식)
    - 각 항목의 산출 근거

    ### 7. 추진 역량
    - 기업의 관련 역량 및 경험
    - 보유 기술 및 자원
    - 과거 성과

    주의사항:
    - 모든 내용은 구체적이고 현실적이어야 합니다
    - 숫자는 천단위 콤마를 사용하여 표기합니다
    - 표는 마크다운 테이블 형식으로 작성합니다
    - 과장된 표현을 지양하고 사실에 기반합니다

  executive_summary: |
    다음 사업계획서의 요약본(Executive Summary)을 작성해주세요.

    기업: {company_name}
    사업: {grant_title}

    전체 내용:
    {full_content}

    요약본 작성 요구사항:
    - 분량: 300-500자
    - 핵심 내용만 간결하게 정리
    - 사업의 목적, 목표, 기대효과 중심
    - 한 눈에 파악할 수 있도록 구조화

  section_only: |
    사업계획서의 다음 섹션만 작성해주세요.

    섹션: {section_name}
    공고 정보: {grant_info}
    기업 정보: {company_info}

    {section_instructions}

# 공고 분석 프롬프트
grant_analysis:
  summarize: |
    다음 정부지원사업 공고를 분석하여 핵심 내용을 요약해주세요.

    제목: {title}
    내용: {content}

    다음 형식으로 요약해주세요:
    1. 사업 목적 (1-2문장)
    2. 지원 대상 (기업 유형, 산업 분야)
    3. 지원 내용 (금액, 기간)
    4. 주요 자격 요건 (3-5개)
    5. 제출 서류
    6. 주의사항

  extract_requirements: |
    다음 공고에서 자격 요건을 추출해주세요.

    {content}

    다음 형식의 JSON으로 반환해주세요:
    {{
      "company_type": ["예비창업자", "스타트업"],
      "industry": ["IT", "제조"],
      "region": ["서울", "경기"],
      "min_employee": 5,
      "max_employee": 50,
      "min_revenue": 1000000000,
      "other_requirements": ["사업자등록 1년 이상"]
    }}

  extract_keywords: |
    다음 공고에서 핵심 키워드를 추출해주세요.

    {content}

    분야별로 분류하여 JSON 형식으로 반환해주세요:
    {{
      "tech_fields": ["AI", "빅데이터"],
      "industries": ["제조", "IT"],
      "keywords": ["디지털전환", "스마트공장"]
    }}

# 매칭 분석 프롬프트
matching:
  explain_match: |
    다음 기업과 공고의 매칭 근거를 설명해주세요.

    기업 정보:
    {company_info}

    공고 정보:
    {grant_info}

    매칭 점수: {score}점

    다음 내용을 포함하여 설명해주세요:
    1. 왜 이 공고가 기업에 적합한지
    2. 기업의 어떤 강점이 부각될 수 있는지
    3. 주의해야 할 요건이나 조건
    4. 신청 시 강조해야 할 포인트

# 개선 제안 프롬프트
improvement:
  review_proposal: |
    다음 사업계획서를 검토하고 개선점을 제안해주세요.

    {proposal_content}

    다음 항목을 평가하고 개선 방안을 제시해주세요:
    1. 논리성과 설득력
    2. 구체성과 실현 가능성
    3. 문장의 명확성
    4. 정량적 목표의 적절성
    5. 전체적인 완성도

    각 항목당 5점 만점으로 평가하고, 구체적인 개선 방안을 제시해주세요.

# 응답 형식
response_formats:
  proposal_output: |
    제목: {title}

    {content}

    ---
    작성일: {created_at}
    작성자: GovPlan_AI
    버전: {version}

  json_output: |
    {{
      "status": "success",
      "data": {{content}},
      "metadata": {{
        "model": "{model}",
        "tokens": {tokens},
        "created_at": "{timestamp}"
      }}
    }}
